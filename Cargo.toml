[package]
name = "ready_yet"
version = "0.1.0"
edition = "2024"
description = "Watch your PC start up: what has launched, what is still to come, and how long until it is usable."
repository = "https://github.com/fredle/ready-yet"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
